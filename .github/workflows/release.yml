name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: node scripts/build-release-zip.mjs

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: food-icon-pack-free-classic.zip
          body: |
            **743+ outline food icons** — ingredients, utensils, dishes, beverages.

            - Browse: https://foodiconpack.com/free-food-icons
            - License: https://foodiconpack.com/license (CC BY 4.0)
